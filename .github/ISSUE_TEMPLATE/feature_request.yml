name: 功能建议
description: 提出新功能或使用体验改进建议。
title: "[建议] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        请先[搜索已有建议](https://github.com/superdaxigua/material-archiver/issues)，相同需求可直接补充使用场景。
        反馈会公开显示，请勿填写密码、个人路径或其他敏感信息。
  - type: textarea
    id: problem
    attributes:
      label: 使用场景与遇到的问题
      description: 你在整理什么素材？目前哪一步不方便？
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 希望如何改进
      description: 请描述你希望增加的功能或操作方式，可附示例或截图。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 当前的替代办法（可选）
      description: 你现在如何处理？替代办法有什么不足？
  - type: input
    id: environment
    attributes:
      label: 软件版本与安装方式（可选）
      placeholder: 例如：1.2.0，飞牛应用（fpk）
